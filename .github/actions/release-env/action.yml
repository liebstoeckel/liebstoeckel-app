# The setting every release-test job of os-matrix.yml starts from: a results
# directory and a start time for the summary, and on request the runner's Chrome,
# a throwaway local registry with this commit's packages, and a `bun` first on
# PATH that fails loudly (the test is then about a machine without Bun).
name: release-env
description: Results directory, the runner's Chrome, a local registry with the packed packages, a failing bun on PATH.
inputs:
  defender:
    description: on Windows, keep Defender's real-time scan out of the folders the job writes (off keeps the machine as a user has it)
    default: "true"
  chrome:
    description: set LIEBSTOECKEL_CHROMIUM to the runner's Chrome
    default: "false"
  registry:
    description: start a local Verdaccio with the packed packages and point npm, pnpm and Bun at it
    default: "false"
  trap:
    description: put a bun (and bunx) first on PATH that fails loudly
    default: "false"
runs:
  using: composite
  steps:
    - name: Results directory and start time
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/results"
        echo "RELEASE_OUT=$RUNNER_TEMP/results" >> "$GITHUB_ENV"
        echo "RELEASE_START=$(date +%s)" >> "$GITHUB_ENV"
    # Defender scans every file npm and Bun write, which makes installs on a Windows
    # runner about three times slower than on Linux. The install job leaves it on, so
    # one job per run meets Windows the way a user's machine does.
    - name: Defender off for the job's folders
      if: runner.os == 'Windows' && inputs.defender == 'true'
      shell: pwsh
      run: |
        $paths = @($env:RUNNER_TEMP, $env:GITHUB_WORKSPACE, $env:LOCALAPPDATA, $env:APPDATA, (Join-Path $env:USERPROFILE ".bun"))
        Add-MpPreference -ExclusionPath $paths
        (Get-MpPreference).ExclusionPath
    - name: The runner's Chrome
      if: inputs.chrome == 'true'
      shell: bash
      run: |
        case "$RUNNER_OS" in
          Linux) chrome=/usr/bin/google-chrome ;;
          Windows) chrome='C:\Program Files\Google\Chrome\Application\chrome.exe' ;;
          macOS) chrome='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' ;;
        esac
        if [ ! -e "$chrome" ]; then echo "no Chrome at $chrome" >&2; exit 1; fi
        echo "LIEBSTOECKEL_CHROMIUM=$chrome" >> "$GITHUB_ENV"
        # On Windows chrome.exe --version opens a browser instead of printing.
        if [ "$RUNNER_OS" = Windows ]; then
          powershell -NoProfile -Command "(Get-Item '$chrome').VersionInfo.ProductVersion"
        else
          "$chrome" --version
        fi
    - if: inputs.registry == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: packages
        path: ${{ runner.temp }}/packed
    - name: A local registry with this commit's packages
      if: inputs.registry == 'true'
      shell: bash
      run: |
        registry=http://127.0.0.1:4873/
        vd="$RUNNER_TEMP/verdaccio"
        mkdir -p "$vd/storage"
        # @liebstoeckel/* only from what this commit packed, never proxied: a test
        # must not pass against the version already on npm.
        cat > "$vd/config.yaml" <<CONFIG
        storage: ./storage
        uplinks:
          npmjs:
            url: https://registry.npmjs.org/
        packages:
          '@liebstoeckel/*':
            access: \$all
            publish: \$all
          '**':
            access: \$all
            proxy: npmjs
        log: { type: stdout, format: pretty, level: warn }
        CONFIG
        # Installed first, then started: on a cold Windows runner the download alone
        # can take two minutes, which is not a slow start.
        npm install --prefix "$vd/tool" --no-audit --no-fund verdaccio@6.1.6
        (cd "$vd" && node "$vd/tool/node_modules/verdaccio/bin/verdaccio" --config config.yaml --listen 127.0.0.1:4873 > "$RELEASE_OUT/verdaccio.log" 2>&1 &)
        for i in $(seq 1 60); do curl -fs -o /dev/null "${registry}-/ping" && break; sleep 1; done
        curl -fs -o /dev/null "${registry}-/ping"
        printf 'registry=%s\n//127.0.0.1:4873/:_authToken=local\n' "$registry" > "$HOME/.npmrc"
        packed="$RUNNER_TEMP/packed"
        node -e '
          const list = require(process.argv[1] + "/packages.json");
          for (const p of list) console.log(p.file);
        ' "$packed" | while read -r f; do npm publish "$packed/$f" --registry "$registry" --tag latest; done
        v=$(node -p 'require(process.argv[1] + "/packages.json").find((p) => p.name === "@liebstoeckel/cli").version' "$packed")
        {
          echo "REGISTRY=$registry"
          echo "npm_config_registry=$registry"
          echo "BUN_CONFIG_REGISTRY=$registry"
          echo "CLI_VERSION=$v"
        } >> "$GITHUB_ENV"
        echo "@liebstoeckel/cli $v on $registry"
    - name: A bun first on PATH that fails loudly
      if: inputs.trap == 'true'
      shell: bash
      run: |
        trap_dir="$RUNNER_TEMP/trap-bin"
        mkdir -p "$trap_dir"
        for b in bun bunx; do
          printf '#!/bin/sh\necho "the system %s was called: $*" >&2\nexit 97\n' "$b" > "$trap_dir/$b"
          chmod +x "$trap_dir/$b"
          printf '@echo the system %s was called: %%* 1>&2\r\n@exit /b 97\r\n' "$b" > "$trap_dir/$b.cmd"
        done
        echo "$trap_dir" >> "$GITHUB_PATH"
